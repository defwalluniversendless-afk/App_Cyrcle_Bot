*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Soyuz,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.shell{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 20px env(safe-area-inset-bottom,0px)}
.top{height:60px;flex:none;display:flex;align-items:center;gap:12px}
.ib{width:38px;height:38px;border:0;background:none;color:var(--d);font:inherit;font-size:24px;border-radius:50%;cursor:pointer}
.ib:active{background:#1a1a1a}
.bar{flex:1;height:16px;border-radius:9px;background:#1d1d1d;overflow:hidden}
.bar i{display:block;height:100%;width:0;min-width:16px;background:#fff;border-radius:9px;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.view{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}.view::-webkit-scrollbar{display:none}
.scr{min-height:100%;display:flex;flex-direction:column;animation:in .5s cubic-bezier(.2,.9,.25,1) both}
.scr.out{animation:out .25s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateX(44px) scale(.98)}}
@keyframes out{to{opacity:0;transform:translateX(-44px) scale(.98)}}
.dock{flex:none;padding:12px 0 18px}
.btn{position:relative;overflow:hidden;width:100%;height:56px;border:0;border-radius:16px;background:#fff;color:#000;font:inherit;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #8c8c8c;transition:transform .1s,box-shadow .1s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.btn:disabled{background:#1d1d1d;color:#5a5a5a;box-shadow:0 4px 0 #101010}
.btn.gh{background:#000;color:#fff;border:2px solid #2c2c2c;box-shadow:0 4px 0 #2c2c2c;margin-top:12px}
.btn:not(:disabled):after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.12),transparent);animation:gl 3.2s 1s infinite}
@keyframes gl{to{left:130%}}
.kick{font-size:11px;letter-spacing:.18em;color:var(--d);margin:6px 0 10px}
h2{font-size:30px;line-height:1.08;font-weight:400;margin:0 0 10px}
p.s{color:var(--d);font-size:15px;line-height:1.5;margin:0 0 20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:14px 16px;border:2px solid var(--l);border-bottom-width:4px;border-radius:16px;background:#000;color:#fff;font:inherit;font-size:17px;text-align:left;cursor:pointer;animation:oi .5s both}
@keyframes oi{from{opacity:0;transform:translateY(24px) scale(.96)}}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:#fff;background:#121212;animation:jig .38s}
@keyframes jig{15%{transform:translateX(-4px) rotate(-.7deg)}30%{transform:translateX(4px) rotate(.7deg)}45%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.rg{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid #444;display:grid;place-items:center;font-size:15px;color:#000;transition:.2s}
.sel .rg{background:#fff;border-color:#fff}.rg:after{content:"✓";opacity:0}.sel .rg:after{opacity:1}
.in{display:block;width:100%;padding:16px 18px;border:2px solid var(--l);border-radius:16px;background:#0a0a0a;color:#fff;font:inherit;font-size:17px;outline:none;-webkit-user-select:text;user-select:text;margin-bottom:10px}
textarea.in{min-height:180px;resize:none;line-height:1.45}
.in:focus{border-color:#fff}.in::placeholder{color:#555}
.card{border:2px solid var(--l);border-radius:20px;padding:20px;margin-bottom:12px;animation:oi .5s both}
.card.go{cursor:pointer}.card.go:active{background:#111}
.card.lk{opacity:.4}
.row{display:flex;align-items:center;gap:16px}
.lg{width:54px;height:54px;flex:none;background:var(--logo) center/contain no-repeat}
.chip{display:inline-block;margin:0 6px 6px 0;padding:7px 13px;border:1px solid #444;border-radius:20px;font-size:14px}
.q{color:#cfcfcf;font-size:15px;line-height:1.45;border-left:2px solid #444;padding-left:12px;margin:8px 0 0}
.sm{font-size:13px;color:var(--d)}.ctr{text-align:center}
.mini{height:6px;border-radius:3px;background:#1d1d1d;margin-top:12px;overflow:hidden}.mini i{display:block;height:100%;background:#fff}
